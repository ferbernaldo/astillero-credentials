<svg viewBox="0 0 330 248" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="330" height="248" fill="#0a0a0a"/>
  
  <!-- Diamond shape with ASTILLERO text -->
  <g>
    <!-- Outer diamond border -->
    <polygon points="165,10 310,124 165,238 20,124" fill="none" stroke="#f5f1e8" stroke-width="2"/>
    
    <!-- Inner design -->
    <polygon points="165,30 290,124 165,218 40,124" fill="none" stroke="#f5f1e8" stroke-width="1.5" opacity="0.6"/>
    
    <!-- ASTILLERO text inside diamond -->
    <text x="165" y="140" font-family="Space Grotesk, sans-serif" font-size="48" font-weight="700" text-anchor="middle" fill="#f5f1e8" letter-spacing="2">ASTILLERO</text>
  </g>
</svg>